version: "1.0"
namespace: chicago.display
entries:
  - name: definition
    kind: ns.definition
    meta: {title: Display, description: "Desktop appearance and screen saver previews."}
  - name: shell
    kind: ns.dependency
    component: github.com/chicago-desktop/shell
    version: ">=0.3.1"
  - name: desktop_properties
    kind: registry.entry
    meta: {type: chicago.desktop_menu, order: 900}
    data:
      text: Properties
      image: display_properties
      entry: chicago.display:window
  # chicago.display:images
  #
  # An image pack of the shell (meta.type chicago.images), named
  # `chicago.display:images/<file>` — the picture before every wallpaper name
  # and the blank one of "(None)". Own pixel art, drawn by
  # tools/display_images.py.
  - name: images
    kind: fs.directory
    meta:
      type: chicago.images
      comment: "Display's pictures — a picture file and a blank square for the Wallpaper list (own pixel art, tools/display_images.py)."
    base: module
    directory: ./assets/images
    auto_init: false

  # chicago.display:model
  - name: model
    kind: library.lua
    meta:
      comment: The pure model of "Display Properties" — desktop colors, color format check, resolution and palette captions.
    source: file://model.lua
    imports:
      geometry: chicago.tui_desktop.desktop:geometry

  # Permissions: read and write a setting in the shell database (`db.get` on
  # the resource), ask and nudge the compositor. The database name comes from
  # the migration entry, read by the repository under
  # chicago.shell.security:layout_target — no environment.
  - name: window_scope
    kind: security.policy
    meta:
      comment: Permissions of "Display Properties" — read and write the shell settings in the database, ask the compositor and ask it to reread the desktop.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - db.get
      resources: "*"
      effect: allow

  # chicago.display:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: "Display Properties"
      image: display_properties
      icon: "▭"
      group: Settings
      order: 140
      window_type: dialog
      resizable: false
      # Room for the classic Screen saver and Monitor power groups.
      width: 54
      height: 28
      pixel_render: chicago.shell.sdk:render
      pixel_state: chicago.display:window
      comment: Display Properties — the wallpaper with its Pattern dialog, the desktop color and a preview, applied through the shell settings; resolution and palette are read-only; a window on the shell SDK.
    source: file://window.lua
    method: main
    modules:
      - sql
      - time
      - uuid
      # Display listens for the Pattern dialog's choice; the dialog sends it.
      - process
    security:
      policies: [chicago.display:window_scope, chicago.shell.security:layout_target]
    imports:
      geometry: chicago.tui_desktop.desktop:geometry
      app: chicago.shell.sdk:app
      desktop: chicago.tui_desktop.desktop:window_api
      repo: chicago.shell.persist:repo
      options: chicago.display.pipes:options
      model: chicago.display:model
      patterns: chicago.shell.display:patterns
      wallpapers: chicago.shell.display:wallpapers

  # chicago.display:pattern
  - name: pattern
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Pattern
      image: display_properties
      in_menu: false
      window_type: dialog
      resizable: false
      # The list shows about five patterns, as the original's.
      width: 46
      height: 13
      pixel_render: chicago.shell.sdk:render
      pixel_state: chicago.display:pattern
      comment: "The Pattern dialog of Display Properties — the pattern list and a 1:1 preview over the desktop color; OK sends the choice to the window that opened it, which writes it on Apply."
    source: file://pattern.lua
    method: main
    modules: [json, gfx, base64, process]
    security:
      policies: [chicago.display:window_scope]
    imports:
      app: chicago.shell.sdk:app
      ui: chicago.shell.sdk:ui
      geometry: chicago.tui_desktop.desktop:geometry
      model: chicago.display:model
      patterns: chicago.shell.display:patterns

  - name: tip
    kind: registry.entry
    meta: {type: chicago.tip, order: 40}
    data:
      text: "Right-click an empty spot on the desktop and choose Properties to change wallpaper, patterns and colors. On the Screen Saver tab, choose 3D Pipes and click Preview to watch the pipes grow."
      image: display_properties
      open: chicago.display:window
